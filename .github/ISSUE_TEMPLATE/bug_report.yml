name: Bug report
description: 报告可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请不要在这里粘贴真实 API Key、书籍正文、笔记或备份文件。
        安全问题请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v0.1.3 / main 某次提交
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统
      placeholder: macOS 15.2 arm64 / Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先脱敏；不要粘贴完整书籍正文或 Key。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除真实 API Key、书籍正文、笔记和备份文件
          required: true
