<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />
<title>页边 03</title>
</head>
<body>
<div class="slide">
  <div class="topline">
    <span class="kicker">READING FLOW / 03</span>
    <span class="kicker">THINREAD / PRODUCT NOTES</span>
  </div>
  <div class="layout">
    <div class="copy">
      <div class="eyebrow">ONE CHAPTER AT A TIME</div>
      <h1>先读薄，<br />再谈<em>记住</em>。</h1>
      <p class="lede">打开一章，点「读薄并提炼」。原文先变成可发布的读薄稿，再从稿子里提炼卡片。</p>
      <div class="abc">
      <div class="abc-item"><span class="abc-label">A</span><span class="abc-text"><strong>原文</strong>：断言、论证链、边界都留下。</span></div>
      <div class="abc-item"><span class="abc-label">B</span><span class="abc-text"><strong>读薄</strong>：并列改列表，删重复，不删观点。</span></div>
      <div class="abc-item"><span class="abc-label">C</span><span class="abc-text"><strong>卡片</strong>：用「不知道它是否影响理解」筛选。</span></div>
    </div>
    </div>
    <div class="device">
      <div class="phone">
        <div class="screen contain">
          <img src="assets/screen-03.png" alt="" />
        </div>
      </div>
      <div class="device-caption">EXPORTED SHARE CARD / 1080×1440</div>
    </div>
  </div>
  <div class="footer"><span><strong>页边 · 把一本书读成自己的</strong></span><span>03 / 08</span></div>
</div>
</body>
</html>
