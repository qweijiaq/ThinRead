<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />
<title>页边 04</title>
</head>
<body>
<div class="slide">
  <div class="topline">
    <span class="kicker">CARDS / 04</span>
    <span class="kicker">THINREAD / PRODUCT NOTES</span>
  </div>
  <div class="layout reverse">
    <div class="copy">
      <div class="eyebrow">EVIDENCE, NOT VIBES</div>
      <h1>每张卡，<br />都要能<br /><em>回到原文。</em></h1>
      <p class="lede">卡片不是金句。它要写清在文中的作用；原文依据必须能逐字找到，找不到就不打「已核对」。</p>
      <div class="figures">
      <div class="figure"><strong>5–25</strong><span>张核心卡片</span></div>
      <div class="figure"><strong>1/1</strong><span>依据核查</span></div>
      <div class="figure"><strong>≤3</strong><span>条有限延伸</span></div>
    </div>
    </div>
    <div class="device">
      <div class="phone">
        <div class="screen">
          <img src="assets/screen-04.png" alt="" />
        </div>
      </div>
      <div class="device-caption">REAL UI · DESKTOP CROP</div>
    </div>
  </div>
  <div class="footer"><span><strong>页边 · 把一本书读成自己的</strong></span><span>04 / 08</span></div>
</div>

</html>
