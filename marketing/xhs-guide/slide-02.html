<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="style.css" />
<title>页边 02</title>
</head>
<body>
<div class="slide">
  <div class="topline">
    <span class="kicker">WHAT IT IS / 02</span>
    <span class="kicker">THINREAD / PRODUCT NOTES</span>
  </div>
  <div class="layout reverse">
    <div class="copy">
      <div class="eyebrow">A READING WORKBENCH</div>
      <h1>不是摘要，<br />是<em>读薄</em>。</h1>
      <p class="lede">摘要把书压短；读薄把作者的主张留下来，再变成能继续写的东西。</p>
      <div class="stack">
      <div class="stack-item"><span class="stack-no">01</span><div><p class="stack-title">读薄</p><p class="stack-body">按断言重写整章，删铺垫，不删观点。</p></div></div>
      <div class="stack-item"><span class="stack-no">02</span><div><p class="stack-title">卡片</p><p class="stack-body">5–25 张，写清作用与原文依据。</p></div></div>
      <div class="stack-item"><span class="stack-no">03</span><div><p class="stack-title">成书</p><p class="stack-body">把章节合成一篇有结构的文章。</p></div></div>
    </div>
    </div>
    <div class="device">
      <div class="phone">
        <div class="screen">
          <img src="assets/screen-02.png" alt="" />
        </div>
      </div>
      <div class="device-caption">REAL UI · DESKTOP CROP</div>
    </div>
  </div>
  <div class="footer"><span><strong>页边 · 把一本书读成自己的</strong></span><span>02 / 08</span></div>
</div>
</body>
</html>
