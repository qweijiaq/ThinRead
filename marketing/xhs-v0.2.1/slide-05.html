<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>05 知识地图</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="slide">
    <div class="topline">
      <strong>页边 ThinRead</strong>
      <span>v0.2.1</span>
    </div>
    <div class="main">
      <div class="kicker">知识地图</div>
      <h1>一本书，<br>连回其他书</h1>
      <p class="lead">概念图和人物关系图，把标签、人物、事件连起来。<br>读得越多，网越密。</p>
      <div class="figure"><img src="assets/10-knowledge-map.png" alt="知识地图"></div>
      <div class="points">
        <span>书</span>
        <span>标签</span>
        <span>跨书概念</span>
      </div>
    </div>
    <div class="footer">
      <span>同一个概念，在哪几本书里出现过</span>
      <span class="page">页边 0.2.1</span>
    </div>
  </section>
</body>
</html>
