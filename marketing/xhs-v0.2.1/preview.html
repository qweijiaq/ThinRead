<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 2160px; height: 1440px; background: #ece7de; }
    .grid { display: grid; grid-template-columns: repeat(4, 540px); grid-template-rows: repeat(2, 720px); }
    img { display: block; width: 540px; height: 720px; object-fit: cover; }
  </style>
</head>
<body>
  <div class="grid">
    <img src="01.png" alt=""><img src="02.png" alt=""><img src="03.png" alt=""><img src="04.png" alt="">
    <img src="05.png" alt=""><img src="06.png" alt=""><img src="07.png" alt=""><img src="08.png" alt="">
  </div>
</body>
</html>
