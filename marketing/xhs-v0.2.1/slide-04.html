<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>04 笔记库</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="slide">
    <div class="topline">
      <strong>页边 ThinRead</strong>
      <span>v0.2.1</span>
    </div>
    <div class="main">
      <div class="kicker">笔记库</div>
      <h1>读过的，<br>都找得回来</h1>
      <p class="lead">按书、标签、时间聚合，可筛选、可审计。<br>跨书检索不用再翻文件夹。</p>
      <div class="figure"><img src="assets/09-notes-library.png" alt="笔记库"></div>
      <div class="points">
        <span>按书聚合</span>
        <span>标签筛选</span>
        <span>跨书检索</span>
      </div>
    </div>
    <div class="footer">
      <span>一本书的笔记，不散在聊天记录里</span>
      <span class="page">页边 0.2.1</span>
    </div>
  </section>
</body>
</html>
